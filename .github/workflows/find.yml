name: Find Land Value

on:
  schedule:
    - cron: "23 5,17 * * *"
  workflow_dispatch: {}

concurrency:
  group: land
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Scrape, parse, rank, publish
        run: python -m acres_per_pound.cli publish
      - name: Commit updates
        run: |
          git config user.name "acres-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "update: $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "no changes"
          git push
